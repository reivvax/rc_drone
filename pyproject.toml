[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-follow"
version = "0.1.0"
description = "Drone that follows a moving ArUco marker at a constant distance (Robot Control seminar)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python>=4.8",
    "pyserial>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mavlink = ["pymavlink>=2.4"]
dev = ["pytest>=7", "ruff>=0.4", "pyserial>=3.5"]

[project.scripts]
drone-follow = "drone_follow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
